name: lks-dev-pipeline

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Update Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          docker --version

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REPOSITORY: lks-voting-image
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

  pull_image_master:
    name: Pull Image on Master
    runs-on: [self-hosted, master]
    needs: build
    steps:
      - name: Pull Image
        run: |
          docker login -u AWS -p $(aws ecr get-login-password --region us-east-1) ${{ secrets.ECR_REGISTRY }}
          docker pull ${{ secrets.ECR_REGISTRY }}/lks-voting-image:latest

  pull_image_node1:
    name: Pull Image on Node1
    runs-on: [self-hosted, node1]
    needs: pull_image_master
    steps:
      - name: Pull Image
        run: |
          docker login -u AWS -p $(aws ecr get-login-password --region us-east-1) ${{ secrets.ECR_REGISTRY }}
          docker pull ${{ secrets.ECR_REGISTRY }}/lks-voting-image:latest

  pull_image_node2:
    name: Pull Image on Node2
    runs-on: [self-hosted, node2]
    needs: pull_image_node1
    steps:
      - name: Pull Image
        run: |
          docker login -u AWS -p $(aws ecr get-login-password --region us-east-1) ${{ secrets.ECR_REGISTRY }}
          docker pull ${{ secrets.ECR_REGISTRY }}/lks-voting-image:latest

  deploy:
    name: Deploy to Swarm Cluster
    runs-on: [self-hosted, master]
    needs: pull_image_node2
    steps:
      - name: Deploy Service
        run: |
          docker service update --image ${{ secrets.ECR_REGISTRY }}/lks-voting-image:latest my-swarm-service

